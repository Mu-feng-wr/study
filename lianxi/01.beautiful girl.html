<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01.beautiful girl</title>
    <script src="../js/vue.js"></script>
    <link rel="stylesheet" href="../lianxi/style/01.beautiful.css">
</head>

<body>
    <div id="root">
        <div class="beauty" @mouseover="stop" @mouseout="start">
            <img alt="迪丽热巴" class="dili" :src="imgUrl">
            <img src="../lianxi/img/icon_arrow_left.png" alt="" class="icon-left" @click="previous">
            <img src="../lianxi/img/icon_arrow_left.png" alt="" class="icon-right" @click="next">
            <div class="dian">
                <div class="xiaoDian" :class="index==imgIndex?'active':''" v-for="(p,index) in images" :key="index"
                    @click="dianHandler(index)">
                </div>
            </div>
        </div>
    </div>
</body>

</html>
<script>


    // 你也可以在这里写，但是这个位置就拿不到this实例
    Vue.config.productionTip = false
    new Vue({
        el: '#root',
        data () {
            return {
                images: [],
                imgUrl: '',
                imgIndex: 0,
                timer: ''
            }
        },
        // 数组方法
        // images   .length   长度
        // [index]  获取数据
        // Array.push()   在后面增加一条数据
        // Array.pop()    在后面删除一条数据
        // Array.unshift()    在前面增加一条数据
        // Array.shift()    在前面删除一条数据
        // Array.slice(start,end) 
        // Array.splice(start,num)
        // Array.join('-')  [1,2,3,4]  '1-2-3-4'
        // let data = Array.find((item)=>{ return item.id==id})  
        // let index = Array.findIndex((item)=>{ return item.id==id})  
        created () {
            this.images = [
                { id: 1, url: '../lianxi/img/dili01.jpeg' },
                { id: 2, url: '../lianxi/img/dili02.jpg' },
                { id: 3, url: '../lianxi/img/dili03.jpeg' },
                { id: 4, url: '../lianxi/img/dili04.jpg' },
                { id: 5, url: '../lianxi/img/dili05.jpg' }
            ]
            this.imgUrl = this.images[this.imgIndex].url
            this.setLunbo()
        },
        methods: {
            previous () {
                this.imgIndex--
                console.log(this.imgIndex, this.images.length - 1)
                if (this.imgIndex < 0) {
                    this.imgIndex = this.images.length - 1
                }
                this.imgUrl = this.images[this.imgIndex].url
            },
            next () {
                this.imgIndex++
                console.log(this.imgIndex, this.images.length)
                if (this.imgIndex > this.images.length - 1) {
                    this.imgIndex = 0
                }
                this.imgUrl = this.images[this.imgIndex].url
            },
            start () {
                this.setLunbo()
            },
            stop () {
                clearInterval(this.timer)
            },
            setLunbo () {
                // 这里面的东西，就叫方法体内容
                this.timer = setInterval(() => {
                    this.imgIndex++
                    if (this.imgIndex == this.images.length) {
                        this.imgIndex = 0
                    }
                    this.imgUrl = this.images[this.imgIndex].url

                }, 1000)
            },
            dianHandler (index) {
                this.imgIndex = index
                this.imgUrl = this.images[this.imgIndex].url
            }

        },

    })
</script>
