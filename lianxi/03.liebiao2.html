<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>列表2</title>
		<!-- 引入vue -->
		<script type="text/javascript" src="../js/vue.js"></script>
		<link rel="stylesheet" href="../lianxi/style/03.liebiao2.css">
	</head>

	<body>
		<!-- 准备好一个容器 -->
		<!-- 列表 -->
		<div id="root">
			<table class="table">
				<thead>
					<tr>
						<th class='th'>#</th>
						<th class='th'>Name</th>
						<th class='th'>Sex</th>
						<th class='th'>Address</th>
						<th class='th'>操作</th>
					</tr>
				</thead>
				<tbody>
					<!-- 这是一个模板 你把模版注释，还叫模板？ -->
					<tr v-for="(item,index) in testList" :key="index">
						<td class="td">{{index+1}}</td>
						<td class="td">{{item.name}}</td>
						<td class="td">{{item.sex}}</td>
						<td class="td">{{item.address}}</td>
						<td class="td">
							<div class="todo">
								<div class="ad" @click="gai(item,index)">修改</div>
								<div class="ad" @click="del(item,index)">删除</div>
							</div>
						</td>
					</tr>
				</tbody>
			</table>
			<div class="btnBox">
				<input v-model="editData.name" type="text" placeholder="Name" />
				<input v-model="editData.sex" type="text" placeholder="Sex" />
				<input v-model="editData.address" type="text" placeholder="Address" />
				<button @click="edit">修改</button>
			</div>

			<div class="btnBox">
				<input v-model="addData.name" type="text" placeholder="Name" />
				<input v-model="addData.sex" type="text" placeholder="Sex" />
				<input v-model="addData.address" type="text" placeholder="Address" />
				<button @click="add">添加</button>
			</div>


		</div>
	</body>

</html>
<script type="text/javascript">
	Vue.config.productionTip = false //阻止vue在启动时生成生产提示

	new Vue({

		el: '#root',
		data() {
			return {
				editData: {},
				addData: {},
				testList: [],
				testIndex: 0,
			}
		},
		created() {
			this.testList = [{
					name: 'Test1',
					sex: 'Man',
					address: 'Shenzhen'
				},
				{
					name: 'Test2',
					sex: 'Man',
					address: 'Guangzhou'
				},
				{
					name: 'Test3',
					sex: 'Man',
					address: 'Beijing'
				},
				{
					name: 'Test4',
					sex: 'Man',
					address: 'Shanghai'
				},
			]
		},
		methods: {
			gai(item, index) {
				this.editData = JSON.parse(JSON.stringify(item))
				this.testIndex = index
			},
			del(item, index) {
				this.testList.splice(index, 1)
			},
			add(){
				if(this.addData.name&&this.addData.sex&&this.addData.address){
					this.testList.push(this.addData)
					this.addData={}
				}else{
					alert('填写完整数据')
				}
			},
			edit(){
				if(this.editData.name&&this.editData.sex&&this.editData.address){
					this.$set(this.testList,this.testIndex,this.editData)
					this.editData={}
				}else{
					alert('填写完整数据')
				}
				
			}
		},

	})
</script>
