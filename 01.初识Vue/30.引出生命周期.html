<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>26.v-pre指令</title>
    <!-- 引入vue -->
    <script type="text/javascript" src="../js/vue.js"></script>
</head>

<!-- 
    生命周期：
        1.又名：生命周期回调函数、生命周期函数、生命周期钩子
        2.是生命：Vue在关键时刻帮我们调用的一些特殊名称的函数
        3.生命周期函数的名字不可更改，但函数的具体内容由程序员更具需求自己编写
        4.生命周期函数中的this指向是vm或组件实例对象
 -->

<body>
    <!-- 准备好一个容器 -->

    <div id="root">
        <!-- opacity：opacity 对象简写形式  透明度
        -->
        <h2 :style="{opacity}">欢迎学习Vue</h2>



    </div>
</body>

</html>
<script type="text/javascript">
    Vue.config.productionTip = false//阻止vue在启动时生成生产提示

    const vm = new Vue({

        el: '#root',
        data: {
            opacity: 1,

        },
        methods: {
            change () {

            }
        },
        beforeCreate () {

        },
        created () {

        },
        beforeMount () {

        },
        //挂载完毕 Vue完成模板解析并把初始的真实DOM元素放入页面后（挂载完毕），调用 mounted 
        mounted () {
            setInterval(() => {
                vm.opacity -= 0.01
                if (vm.opacity <= 0) vm.opacity = 1
            }, 16);
        },
        beforeDestroy () {

        },
        destroyed () {

        }


    })
    // 通过外部的定时器实现 不推荐
    // setInterval(() => {
    //     vm.opacity -= 0.01
    //     if (vm.opacity <= 0) vm.opacity = 1
    // }, 16);

</script>
