<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>el和data的两种写法</title>
    <!-- 引入vue -->
    <script src="../js/vue.js"></script>
</head>

<!-- 
    el和data的两种写法
    1.el有两种写法
    （1）.new Vue时候配置el属性
    （2）.先创建vue实例，再通过v.$mount('#root')指定el的值
    2.data有两种写法
    （1）对象式
    （2）函数式
    如何选择：目前哪种方法都可以，以后学习到组件时，data必须使用函数式，否则会报错
    3.一个重要原理：
    由vue管理的函数，一定不要写箭头函数，一旦写箭头函数，this就不再是vue实例对象
 -->

<body>
    <!-- 准备好一个容器 -->

    <div id="root">
        <h1>你好，{{name}}</h1>
    </div>
</body>

</html>
<script type="text/javascript">
    Vue.config.productionTip = false//阻止vue在启动时生成生产提示
    //el的两种写法
   //  const v = new Vue({
   //  //     // el: '#root',
   //      data:{
   //          name: '尚硅谷'
   //      }
   //  })
   //   console.log(v)
	  // v.$mount('#root')
  //    setTimeout(()=>{
	 // v.$mount('#root')
		// },1000);

    //data的两种写法
    new Vue({
        //data的第一种写法：对象式
        el: '#root',
        // data: {
        //     name: '尚硅谷'
        // }
        //data的第二种写法：函数式
        data () {
            console.log('@@@', this)//此处this是vue实例对象
            return {
                name: '尚硅谷'
            }
        }
    })

</script>
