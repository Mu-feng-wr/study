<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>组件的嵌套</title>
    <!-- 引入vue -->
    <script type="text/javascript" src="../js/vue.js"></script>
</head>
<!-- 
	
	 -->

<body>
    <!-- 准备好一个容器 -->
    <div id="root">

    </div>
</body>

</html>
<script type="text/javascript">

    Vue.config.productionTip = false //阻止vue在启动时生成生产提示
    //第一步：定义student组件
    const student = Vue.extend({
        name: 'student',
        template: `
		<div>
		<h2>学生名字：{{studentName}}</h2>
		<h2>学生年龄：{{age}}</h2>
		</div>
		`,
        data () {
            return {
                studentName: '小明',
                age: 18,
            }
        },
    })

    //第一步：定义school组件
    const school = Vue.extend({
        name: 'school',
        template: `
		<div>
		<h2>学校名称：{{schoolName}}</h2>
		<h2>学校地址：{{address}}</h2>
         <student></student>
		</div>
		`,
        data () {
            return {

                schoolName: '尚硅谷',
                address: '昌平',
            }
        },
        //注册school组件(局部注册)
        components: {
            student
        }

    })
    const happy = Vue.extend({
        template: `  <h1>{{msg}}</h1>`,
        data () {
            return {
                msg: '欢迎学习Vue!',
            }
        }
    })
    const app = Vue.extend({
        template: `<div>  
        <school></school>
        <happy></happy>
        </div>
         `,
        components: {
            school,
            happy,
        }
    })
    //创建VM
    new Vue({
        template: `<app></app>`,
        el: '#root',
        //注册school组件(局部注册)
        components: {
            app,

        },

    })
    // new Vue({
    // 	el: '#root2'
    // })
</script>
