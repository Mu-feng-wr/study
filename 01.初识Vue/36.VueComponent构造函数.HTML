<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 36.VueComponent构造函数</title>
    <script type="text/javascript" src="../js/vue.js"></script>
</head>

<body>
    <div id="root">
        <school></school>
    </div>
</body>

</html>
<script type="text/javascript">
    Vue.config.productionTip = false
    const school = Vue.extend({
        name: 'school',
        template: `
		<div>
		<h2>学校名称：{{schoolName}}</h2>
		<h2>学校地址：{{address}}</h2>
		</div>
		`,
        data () {
            return {
                schoolName: '尚硅谷',
                address: '昌平',
            }
        }
    })
    console.log(school)
    new Vue({
        el: '#root',
        components: {
            school
        }
    })
</script>
