<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17.条件渲染</title>
    <script src="../js/vue.js"></script>
</head>

<body>
    <!-- 
    v-if与v-show的区别

    1.v-if通过操纵dom元素来进行切换显示

        表达式为true时，元素存在于dom树中
        表达式为false时，元素从dom树种移除

    2.v-show只是简单控制dom元素的display属性
        渲染HTML元素，符合条件时显示，不符合条件display为none，元素还在dom树


    条件渲染：
        1.v-if
        写法：
        (1)v-if='表达式'
        (2)v-else-if='表达式'
        (3)v-else='表达式'
        适用于：切换频率较低的场合
        特点：不展示的DOM元素直接被移除
        注意：v-if可以和：v-else-if、v-else一起使用，但要求结构不能被打断

        2.v-show
        写法：v-show='表达式'
        适用于：切换频率较高的场合
        特点：不展示的DOM元素未被被移除，仅仅是使用样式隐藏掉

        3.备注：使用v-if时，元素可能无法获取到，而使用v-show一定可以获取到
     -->
    <div id="root">
        <h2>当前的n值是:{{n}}</h2>
        <button @click='n++'>点我n+1</button>
        <!-- 使用v-show来做条件渲染 -->
        <!-- <h2 v-show="false">欢迎来到{{name}}</h2> -->
        <!-- <h2 v-show="1===1">欢迎来到{{name}}</h2> -->

        <!-- 使用v-if来做条件渲染 -->
        <!-- <h2 v-if="false">欢迎来到{{name}}</h2> -->
        <!-- <h2 v-if="1===1">欢迎来到{{name}}</h2> -->

        <!-- <div v-show="n===1">Angular</div> -->
        <!-- <div v-show="n===2">React</div> -->
        <!-- <div v-show="n===3">Vue</div> -->

        <!-- v-else和v-else-if  四句一个套装-->
        <!-- <div v-if="n===1">Angular</div> -->
        <!-- <div v-else-if="n===2">React</div> -->
        <!-- <div v-else-if="n===3">Vue</div> -->
        <!-- <div v-else>哈哈</div> -->

        <!-- template模版展示 只与v-if 配合 -->
        <template v-if="n===1">
            <h2>你好</h2>
            <h2>尚硅谷</h2>
            <h2>北京</h2>
        </template>
    </div>

</body>

</html>
<script>
    Vue.config.productionTop = false
    const vm = new Vue({
        el: '#root',
        data: {
            name: '尚硅谷',
            n: ''
        },

    })
</script>
