<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>07.Vue中数据代理</title>
		<script src="../js/vue.js"></script>
	</head>

	<body>
		<!--
		 1.vue中的数据代理：
			通过vm对象来代理data对象中属性的操作（读写）
		2.	Vue中数据代理的好处：
			更加方便的操作data属性
		3.基本原理：
				通过Object.defineProperty（）把data对象中的所有属性添加到vm上
				为每一个添加vm上的属性都指定一个getter/setter
				在getter/setter内部去操作（读/写）data中对应的数据
			
		 
		 -->
		<div id="root">
		   <h2>学校名称：{{name}}</h2>
		   <h2>学校地址：{{address}}</h2>
		</div>
	</body>

</html>
<script>
	Vue.config.productionTip=false
	const vm=new Vue({
		el:'#root',
		data:{
			name:'尚硅谷',
			address:'宏福科技园'
		}
	})
</script>
