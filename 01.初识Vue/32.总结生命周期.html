<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>26.v-pre指令</title>
    <!-- 引入vue -->
    <script type="text/javascript" src="../js/vue.js"></script>
</head>

<!-- 
    常用的生命周期钩子：
        1.mounted：发送ajax请求、启动定时器、绑定自定义事件、订阅消息等【初始化操作】
        2.beforeDestroy：清除定时器、绑定自定义事件、取消订阅消息等【收尾工作】
        
    关于销毁Vue实例：
        1.销毁后借助Vue开发者工具看不到任何信息
        2.销毁后自定义事件会失效，但原生DOM事件依然会有效
        3.一般不会在 beforeDestroy操作数据，因为即使操作数据，也不会再触发更新流程了
 -->

<body>
    <!-- 准备好一个容器 -->

    <div id="root">
        <!-- opacity：opacity 对象简写形式  透明度
        -->
        <h2 :style="{opacity}">欢迎学习Vue</h2>

        <button @click="stop">点我停止变换</button>
        <button @click="opacity=1">透明度设置为1</button>

    </div>
</body>

</html>
<script type="text/javascript">
    Vue.config.productionTip = false//阻止vue在启动时生成生产提示

    const vm = new Vue({

        el: '#root',
        data: {
            opacity: 1,

        },
        methods: {
            stop () {
                //自杀
                // clearInterval(this.timer)
                this.$destroy()
            }
        },
        beforeCreate () {

        },
        created () {

        },
        beforeMount () {

        },
        //挂载完毕 Vue完成模板解析并把初始的真实DOM元素放入页面后（挂载完毕），调用 mounted 
        mounted () {
            this.timer = setInterval(() => {
                vm.opacity -= 0.01
                if (vm.opacity <= 0) vm.opacity = 1
            }, 16);
        },
        beforeDestroy () {
            console.log('vm即将驾鹤西去')
            clearInterval(this.timer)
        },
        destroyed () {

        }


    })
    // 通过外部的定时器实现 不推荐
    // setInterval(() => {
    //     vm.opacity -= 0.01
    //     if (vm.opacity <= 0) vm.opacity = 1
    // }, 16);

</script>
