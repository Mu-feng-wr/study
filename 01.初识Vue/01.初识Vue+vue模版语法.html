<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初识Vue</title>
    <script src="../js/vue.js"></script>
</head>

<body>
    <!-- 初识Vue：
    1.想让vue工作，就必须创建一个Vue实例，且要传入一个配置对象
    2.root容器里代码依然符合html规范，只不过混合了一些特殊的Vue语法
    3.root容器里的代码被称为【vue模版】
    4.Vue实例和容器一一对应
    5.真实开发中只有一个Vue实例，并且配合着组件一起使用
    6.{{xxx}}中的xxx要写js表达式，且xxx可以自动读取到data中所有的属性
    7.一旦data中的数据发生改变。那么页面中用到该数据的地方也会自动更新

    注意区分：js表达式(特殊的js代码)和 js代码（语句）
    1.表达式：一个表达式会生成一个值，可以放在任何一个需要值的地方
    （1）.a
    （2）.a+b
    （3）.demo(1)
    （4）.x===y?'a':'b'
    2.js代码（语法）
     (1).if(){}
     (2)for(){}

     -->
    <!-- 
        Vue模版语法有2大类：
        1.插值语法：
            功能：用于解析标签体内容
             写法：{{xxx}},xxx是js表达式，且可以直接读取到data中所有属性
        2.指令语法
            功能：用于解析标签（包括：标签属性、标签体内容、绑定事件。。。）
            举例：v-bind:href="xxx"或 简写为 ：href="xxx",xxx同样要写js表达式，且可以直接读取到data中所有属性
            备注：Vue中有很多指令，且形式都是:v-????,此处只是用v-bind举个例子
      -->
    <!-- 准备好一个容器 -->
    <div id="root">
        <!-- <h1>Hello,{{name.toUpperCase()}},{{address}},{{Date.now()}}</h1> -->
        <h1>插值语法</h1>
        <h3>你好，{{name}}</h3>
        <hr>
        <h1>指令语法</h1>
        <a v-bind:href="school.url.toUpperCase()" v-bind:x="school.hello">点我去{{school.name}}学习1</a>
        <a :href="school.url" :x="school.hello">点我去{{school.name}}学习2</a>
    </div>
</body>


</html>
<script>
    //develop 开发  生成环境 master  测试环境 release   API方法、接口
    //git仓库

    // vue  链接 js与html
    // MVVM模式 Model-View-ViewModel模式  Model=JS View=html  ViewModel=框架vue
    Vue.config.productionTip = false//阻止vue在启动时生成生产提示
    //创建Vue实例
    new Vue({
        el: '#root', //el用于指定当前Vue实例为哪个容器服务，值通常为css选择器字符串
        data: {//data中用于储存数据，数据供el所指定的容器去使用，值我们暂时先写出一个对象
            name: 'jack',
            // address: '北京'
            school: {
                name: '尚硅谷',
                url: 'http://www.atguigu.com',
                hello: '你好'
            }
        }
    })

</script>
