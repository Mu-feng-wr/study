<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 37.一个重要的内置关系</title>
    <script type="text/javascript" src="../js/vue.js"></script>
</head>
<!-- 
    1.一个重要的内置关系:VueComponent.prototype._ _proto_ _ === Vue.prototype
    2.为什么要有这个关系：让组件实例对象（vc）可以访问到 Vue原型上的属性和方法
 -->

<body>
    <div id="root">
        <school></school>

    </div>
</body>

</html>
<script type="text/javascript">
    Vue.config.productionTip = false
    Vue.prototype.x = 99
    const school = Vue.extend({
        name: 'school',
        template: `
		<div>
		<h2>学校名称：{{schoolName}}</h2>
		<h2>学校地址：{{address}}</h2>
        <button @click='showX'>点我输出x</button>
		</div>
		`,
        data () {
            return {
                schoolName: '尚硅谷',
                address: '昌平',
            }
        },
        methods: {
            showX () {
                console.log(this.x)
            }
        }
    })

    const vm = new Vue({
        el: '#root',
        components: {
            school
        }
    })
</script>
