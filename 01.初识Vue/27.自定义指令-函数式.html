<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>27.自定义指令-函数式</title>
    <!-- 引入vue -->
    <script type="text/javascript" src="../js/vue.js"></script>
</head>

<!-- 
 自定义指令-函数式:
    需求1.定义一个v-big指令，和v-text功能类似，但会把绑定的数值放大十倍
    需求2.定义一个v-fbind指令，和v-text功能类似，但可以让其所绑定的input元素默认获取焦点
    
 -->

<body>
    <!-- 准备好一个容器 -->

    <div id="root">
        <h2>当前的n值是:<span v-text="n"></span></h2>
        <h2>放大十倍的n值是:<span v-big="n"></span></h2>
        <button @click='n++'>点我n+1</button>

        <h2></h2>
    </div>
</body>

</html>
<script type="text/javascript">
    Vue.config.productionTip = false//阻止vue在启动时生成生产提示

    new Vue({

        el: '#root',
        data: {
            n: 1,
        },
        //指令
        directives: {
            //big函数何时会被调用？
            //1.指令与元素成功绑定时（一上来） 2.指令所在的模版被重新解析时
            big (element, binding) {
                element.innerText = binding.value * 10
                console.log('big')
            }
        }


    })

</script>
