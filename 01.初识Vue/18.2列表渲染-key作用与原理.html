<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18.2列表渲染-key作用与原理</title>
    <script src="../js/vue.js"></script>
</head>

<body>
    <!-- 
面试题：react、vue中key有什么作用？

        1.虚拟DOM对象的标识，当数据发生变化时，vue会根据【新数据】生成【新的虚拟DOM】，随后vue进行【新的虚拟DOM】与【旧的虚拟DOM】的差异对比，比较规则：

        2.比较规则：

            (1)旧的虚拟DOM中找到了与新的虚拟DOM相同的key：
            a.若虚拟DOM中内容没变，直接使用之前的真实DOM
            b.若虚拟DOM中内容变了，则生成新的真实DOM，随后替换掉页面中之前的真实DOM
            (2)旧的虚拟DOM中未找到与新的虚拟DOM相同的key：
            创建新的真实DOM,随后渲染到页面

        3.用index作为key可能会引发的问题：
            1.若对数据进行：逆序添加、逆序删除等破坏顺序操作：会产生没有必要的真实DOM更新==》界面效果没问题，但效率低

            2.如果结构还包含输入类的DOM：会产生错误DOM更新==>界面有问题

        4.开发中如何选择key？

             1.最好使用每条数据的唯一标识作为key，比如：id、手机号、身份证号、学号等唯一值
             2.如果不存在对数据的逆序添加、逆序删除等破坏顺序操作，仅用于渲染列表用于展示，使用index作为key是没有问题的

     -->
    <div id="root">
        <h2>人员列表（遍历数组）</h2>
        <button @click.once="add">添加一个老李</button>
        <ul>
            <!-- 遍历数组 -->
            <!-- key是节点唯一标识 -->
            <li v-for="(p,index ) of persons" :key="p.id">
                {{p.name}}-{{p.age}}
                <input type="text">
            </li>
        </ul>

    </div>
</body>

</html>
<script>
    Vue.config.productionTip = false
    const vm = new Vue({
        el: '#root',
        data: {
            persons: [
                { id: '001', name: '张三', age: 18 },
                { id: '002', name: '李四', age: 19 },
                { id: '003', name: '郭五', age: 17 }
            ]
        },
        methods: {
            add () {
                const p = { id: '004', name: '老李', age: 40 }
                this.persons.unshift(p)
            }
        }
    })
</script>
