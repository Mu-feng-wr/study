<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<title>10事件修饰符</title>
	<script src="../js/vue.js"></script>
	<style>
		* {
			margin-top: 20px
		}

		.demo1 {
			height: 50px;
			background-color: skyblue;
		}

		.box1 {
			padding: 5px;
			background-color: aqua;
		}

		.box2 {
			padding: 5px;
			background-color: red;
		}

		.list {
			width: 200px;
			height: 200px;
			background-color: peru;
			overflow: auto;
		}

		li {
			height: 100px;
		}
	</style>
</head>

<body>
	<!-- 
		vue中的事件修饰符：
		1.prevent:阻止默认事件（常用）
		2.stop：阻止事件冒泡（常用）
		3.once：事件只触发一次（常用）
		4.capture：使用事件的捕获模式
		5.self：只有event.target是当前操作的元素，是才操作事件
		6.passive：事件默认行为执行立即执行，无需等待事件回调执行完毕

	 -->
	<div id="root">
		<h2>欢迎来到{{name}}学习</h2>
		<!-- 阻止默认事件（常用） -->
		<a href="http://www.atguigu.com" @click.prevent="showInfo">点我提示信息</a>
		<!-- 阻止事件冒泡（常用） -->
		<div class="demo1" @click="showInfo">
			<button @click.stop="showInfo">点我提示信息</button>
		</div>
		<!-- 事件只触发一次（常用） -->
		<button @click.once="showInfo">点我提示信息</button>
		<!-- 使用事件的捕获模式 -->
		<div class="box1" @click.capture="showMsg(1)">
			div1
			<div class="box2" @click="showMsg(2)">div2</div>
		</div>
		<!-- 只有event.target是当前操作的元素，是才操作事件 -->
		<div class="demo1" @click.self="showInfo">
			<button @click="showInfo">点我提示信息</button>
		</div>
		<!-- 事件默认行为执行立即执行，无需等待事件回调执行完毕 -->
		<!--  @scrool="demo" 滚动条 -->
		<!-- @wheel="demo" 滚动轮 -->
		<ul @wheel.passive="demo" class="list">
			<li>1</li>
			<li>2</li>
			<li>3</li>
			<li>4</li>
		</ul>
	</div>
</body>

</html>
<script>
	Vue.config.productionTip = false

	const vm = new Vue({
		el: '#root',
		data: {
			name: '尚硅谷'
		},
		methods: {
			showInfo (e) {
				alert("同学你好")
				// e.stopPropagation() ==  @click.stop 阻止事件冒泡（常用）
				// e.preventDefault() ==  @click.prevent 阻止默认事件
			},
			showInfo (msg) {
				console.log(msg)
			},
			demo () {
				// for (let i = 0; i < 10000; i++) {

				// 	console.log('#')
				// }
				console.log('累坏了')
			}
		}
	})

</script>
