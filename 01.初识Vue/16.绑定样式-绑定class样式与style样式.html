<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16.绑定样式-绑定class样式</title>
    <script src="../js/vue.js"></script>
</head>

<body>
    <!-- 
        绑定样式：
        1.class样式
         写法：class="xxx" xxx可以是字符串、对象、数组。
            字符串写法适用于：类名不确定，要动态获取
            对象写法适用于：要绑定多个样式，个数不确定，名字也不确定
            数组写法适用于：要绑定多个样式，个数确定，名字确定，但不确定用不用
        2.style样式
            :style=:"{fontSize:xxx}" 其中xxx是动态值
            :style=:"[a,b]" 其中a,b是样式对象

     -->
    <div id="root">
        <!-- 绑定class样式--字符串写法，适用于：样式的类名不确定，需要动态指定 -->
        <div class="basic" :class="mood" @click="changeMood">{{name}}</div>
        <br>
        <!-- 绑定class样式--  数组写法适用于：要绑定多个样式，个数不确定，名字也不确定 -->
        <div class="basic" :class="classArr">{{name}}</div>
        <br>
        <!-- 绑定class样式-- 对象写法适用于：要绑定多个样式，个数确定，名字确定，但要动态决定用不用 -->
        <div class="basic" :class="classObj">{{name}}</div>
        <br>
        <!-- 绑定style样式-- 对象写法 -->
        <div class="basic" :style="styleObj">{{name}}</div>
        <br>
        <div class="basic" :style="[styleObj,styleObj2]">{{name}}</div>
        <br>
        <!-- 绑定style样式-- 数组写法 -->
        <div class="basic" :style="styleArr">{{name}}</div>
    </div>
</body>

</html>
<script>
    Vue.config.productionTip = false
    const vm = new Vue({
        el: '#root',
        data: {
            name: '尚硅谷',
            mood: 'normal',
            classArr: ['atguigu1', 'atguigu2', 'atguigu3'],
            classObj: {
                atguigu1: false,
                atguigu2: false,
            },
            //样式对象，key不能随便乱写，得写存在的
            styleObj: {
                //样式对象的key
                fontSize: '40px',
                color: 'grey'
            },
            styleObj2: {
                backgroundColor: 'yellow'
            },
            styleArr: [
                {
                    fontSize: '40px',
                    color: 'blue'
                },
                {

                    backgroundColor: 'red'
                }
            ]
        },
        methods: {
            changeMood () {
                const arr = ['happy', 'sad', 'normal']
                const index = Math.floor(Math.random() * 3)
                this.mood = arr[index]
            }
        },


    })
</script>
<style>
    .basic {
        width: 400px;
        height: 100px;
        border: 1px solid black;
    }

    .normal {
        border: 4px solid green;
        background-color: rgba(255, 255, 0, 644);
        background: linear-gradient(60deg, yellow, pink, blue, yellow);
    }

    .sad {
        border: 4px solid pink;
        background-color: rgba(255, 255, 0, 644);
        background: linear-gradient(90deg, yellow, red, orange, yellow);
    }

    .happy {
        border: 4px solid red;
        background-color: rgba(255, 255, 0, 644);
        background: linear-gradient(30deg, yellow, pink, orange, yellow);
    }

    .atguigu1 {
        border-radius: 20px;
    }

    .atguigu2 {
        border-radius: 30px;
        border: 4px solid green;
        background-color: aqua;
    }

    .atguigu3 {
        border-radius: 10px;
        border: 4px solid pink;
        background-color: blueviolet;
    }
</style>
