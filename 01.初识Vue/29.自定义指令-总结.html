<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>27.自定义指令-对象式</title>
    <!-- 引入vue -->
    <script type="text/javascript" src="../js/vue.js"></script>
</head>

<!-- 

    需求1.定义一个v-big指令，和v-text功能类似，但会把绑定的数值放大十倍
    需求2.定义一个v-fbind指令，和v-text功能类似，但可以让其所绑定的input元素默认获取焦点(atuofocus)

 自定义指令-总结:
    一、定义语法：
    (1).局部指令：
        new Vue({                                new Vue({    
            directive:{指令名：配置对象}  或             directive:{指令名：回调函数} 
        })                                           })
   
    (2).全局指令：
                            
             Vue.directive:{指令名,配置对象}    或           Vue.directive:{指令名,回调函数}
    二、配置对象中常用的3个回调：
        1.fbind:指令与元素成功绑定时调用
        2. inserted ：指令所在元素被插入页面时调用
        3. update：指令所在模板被重新解析时调用

    三、备注：
        1.指令定义时不加v-，但是使用时要加v-
        2.指令名如果是多个单词，要使用kebab-case命名方式，不要用camelCase命名
 -->

<body>
    <!-- 准备好一个容器 -->

    <div id="root">
        <h2>当前的n值是:<span v-text="n"></span></h2>
        <!-- <h2>放大十倍的n值是:<span v-big-number="n"></span></h2> -->
        <h2>放大十倍的n值是:<span v-big="n"></span></h2>
        <button @click='n++'>点我n+1</button>
        <hr>
        <input type="text" v-fbind:value="n">

        <h2></h2>
    </div>
</body>

</html>
<script type="text/javascript">
    Vue.config.productionTip = false//阻止vue在启动时生成生产提示
    // //全局指令
    // Vue.directive('fbind', {
    //     //指令与元素成功绑定时（一上来）
    //     bind (element, binding) {
    //         // console.log('bind')
    //         element.value = binding.value
    //     },
    //     //指令所在元素被插入页面上
    //     inserted (element, binding) {
    //         // console.log('inserted')
    //         element.focus()
    //     },
    //     //指令所在模板被重新解析时
    //     update (element, binding) {
    //         // console.log('update')
    //         element.value = binding.value
    //         element.focus()
    //     }

    // })
    // Vue.directive('big', function (element, binding) {
    //     element.innerText = binding.value * 10
    //     console.log('big', this)
    // })

    new Vue({

        el: '#root',
        data: {
            n: 1,
        },
        //局部指令 
        directives: {
            //big函数何时会被调用？
            //1.指令与元素成功绑定时（一上来） 2.指令所在的模版被重新解析时

            // ' big-number' (element, binding) {
            //     element.innerText = binding.value * 10
            //     // console.log('big')
            // },
            big (element, binding) {
                element.innerText = binding.value * 10
                // console.log('big', this)//指令里的this是window
            },
            // fbind (element, binding) {
            //     element.innerText = binding.value
            //     element.focus()
            // }
            fbind: {
                //指令与元素成功绑定时（一上来）
                bind (element, binding) {
                    // console.log('bind')
                    element.value = binding.value
                },
                //指令所在元素被插入页面上
                inserted (element, binding) {
                    // console.log('inserted')
                    element.focus()
                },
                //指令所在模板被重新解析时
                update (element, binding) {
                    // console.log('update')
                    element.value = binding.value
                    element.focus()
                }

            }
        }


    })

</script>
